name: Build and Deploy to EC2 with Predefined Environment Variables

on:
  # main 브랜치로 코드가 푸시될 때 실행
  push:
    branches:
      - main
      - dev
  # main 브랜치로 PR이 병합될 때 (pull request가 closed 될 때) 실행
  pull_request:
    branches:
      - main
      - dev
    types:
      - closed

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # 1. 코드 체크아웃
      - name: Check out code
        uses: actions/checkout@v3

      # 2. Java 17 설치
      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          java-version: 17
          distribution: 'zulu'

      # 3. Gradle 실행 권한 부여
      - name: Grant execute permission for gradlew
        working-directory: backend
        run: chmod +x ./gradlew

      # 4. Build 수행
      - name: Build
        working-directory: backend
        env:
          DB_URL: ${{ secrets.DB_URL }}
          DB_USERNAME: ${{ secrets.DB_USERNAME }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          WEATHER_KEY: ${{ secrets.WEATHER_KEY }}
        run: |
          echo "DB_URL=${{ secrets.DB_URL }}"
          echo "DB_USERNAME=${{ secrets.DB_USERNAME }}"
          echo "DB_PASSWORD=${{ secrets.DB_PASSWORD }}"
          ./gradlew clean build -x test \
            -DdbUrl=${{ secrets.DB_URL }} \
            -DdbUsername=${{ secrets.DB_USERNAME }} \
            -DdbPassword=${{ secrets.DB_PASSWORD }} \
            -Dweather.key=${{ secrets.WEATHER_KEY }}

      # 5. AWS 자격 증명 설정 및 JAR 파일 S3 업로드
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v3
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload JAR to S3
        run: |
          echo "Uploading JAR file to S3..."
          aws s3 cp backend/build/libs/backend-0.0.1-SNAPSHOT.jar s3://${{ secrets.S3_JAR_BUCKET_NAME }}/backend-0.0.1-SNAPSHOT.jar

      # 6. EC2에서 JAR 다운로드
      - name: Download JAR from S3
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "Creating deployments directory..."
            mkdir -p /home/ubuntu/deployments

            echo "Downloading JAR file from S3..."
            aws s3 cp s3://${{ secrets.S3_JAR_BUCKET_NAME }}/backend-0.0.1-SNAPSHOT.jar /home/ubuntu/deployments/backend-0.0.1-SNAPSHOT.jar

            echo "Verifying JAR file..."
            if [ -f /home/ubuntu/deployments/backend-0.0.1-SNAPSHOT.jar ]; then
              echo "JAR file successfully downloaded!"
            else
              echo "JAR file download failed!"
              exit 1
            fi

      # 7. EC2에서 애플리케이션 실행
      - name: Start Application on EC2
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.HOST_PROD }}
          username: ubuntu
          key: ${{ secrets.PRIVATE_KEY }}
          script: |
            echo "Stopping existing application (if any)..."
            if lsof -i:8080; then
              PID=$(lsof -t -i:8080)
              kill -15 $PID
              sleep 5
            else
              echo "No process found using port 8080."
            fi
            
            echo "Starting new application..."
            nohup java \
              -Dspring.profiles.active=aws \
              -Dspring.datasource.url=${DB_URL} \
              -Dspring.datasource.username=${DB_USERNAME} \
              -Dspring.datasource.password=${DB_PASSWORD} \
              -DAWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID} \
              -DAWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY} \
              -DAWS_REGION=${AWS_REGION} \
              -DS3_BUCKET_NAME=${S3_BUCKET_NAME} \
              -DKAKAO_REST_API_KEY=${KAKAO_REST_API_KEY} \
              -DKAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET} \
              -DJWT_SECRET=${JWT_SECRET} \
              -Dweather.key=${WEATHER_KEY} \
              -jar /home/ubuntu/deployments/backend-0.0.1-SNAPSHOT.jar > /home/ubuntu/deployments/app.log 2>&1 &
      
            echo "Sleeping for 10 seconds to allow the application to start..."
            sleep 10
      
            echo "Checking if the application is running..."
            ps -ef | grep java
      
            echo "Checking if the log file exists..."
            if [ -f /home/ubuntu/deployments/app.log ]; then
              echo "Log file found. Displaying the last 10 lines:"
              tail -n 10 /home/ubuntu/deployments/app.log
            else
              echo "Log file not found. Application might have failed to start."
              exit 1
            fi
