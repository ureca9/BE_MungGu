<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kakao Login Test</title>
    <script>
        // Kakao 인증 요청 URL 구성
        const REST_API_KEY = "f5073399aab84d115f651941e6f66e5c"; // 카카오 REST API 키로 변경
        const REDIRECT_URI = "http://localhost:8080/auth/callback/kakao"; // 콜백 URL로 변경

        function loginWithKakao() {
            const kakaoAuthUrl = `https://kauth.kakao.com/oauth/authorize?response_type=code&client_id=${REST_API_KEY}&redirect_uri=${encodeURIComponent(REDIRECT_URI)}`;
            window.location.href = kakaoAuthUrl; // Kakao 로그인 페이지로 리다이렉트
        }

        // URL에서 code 파라미터 추출 후 GET 요청 전송
        function handleKakaoCallback() {
            const urlParams = new URLSearchParams(window.location.search);
            const code = urlParams.get("code");

            if (code) {
                const requestUrl = `https://meong9.store/api/v1/auth/callback/kakao?code=${code}`;
                // GET 요청
                fetch(requestUrl)
                    .then(response => response.json())
                    .then(data => {
                        console.log("Response from server:", data);
                        alert("Login successful!"); // 성공 시 알림
                    })
                    .catch(error => {
                        console.error("Error during login process:", error);
                        alert("Login failed. Please try again."); // 실패 시 알림
                    });
            } else {
                console.log("No code parameter found in the URL.");
            }
        }

        // 페이지 로드 시 handleKakaoCallback 실행
        window.onload = handleKakaoCallback;
    </script>
</head>
<body>
<h1>Kakao Login Test</h1>
<button onclick="loginWithKakao()">Login with Kakao</button>
</body>
</html>
